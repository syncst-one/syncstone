name: Release
# Runs when a version tag is pushed, or by hand from the Actions tab ("Run workflow": then the tag is created from the
# current commit, named after the version in manifest.json).
#  - Stable:  tag 0.3.0 on main. The tag must equal the version in manifest.json (that file on main is what Obsidian's
#             plugin directory reads).
#  - Beta:    tag 0.3.0-beta.1 on DEV. Published as a GitHub pre-release for BRAT; the released manifest.json carries the
#             beta version, the one in the repository stays on the last stable version, so the directory never offers it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Version
        id: version
        run: |
          v="$(node -p "require('./manifest.json').version")"
          prerelease=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              *-*)
                # Beta: the tag names the version; the release gets a manifest.json with it.
                prerelease=true
                v="${GITHUB_REF_NAME}"
                node -e "const f='manifest.json';const m=require('./'+f);m.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$v"
                ;;
              *)
                if [ "${GITHUB_REF_NAME}" != "$v" ]; then
                  echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v" >&2
                  exit 1
                fi
                ;;
            esac
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Proof that the release files were built from this repository (shown in the Obsidian directory review).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
